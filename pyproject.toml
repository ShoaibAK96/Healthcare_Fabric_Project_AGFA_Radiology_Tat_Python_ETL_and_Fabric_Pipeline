[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiology-tat-fabric-pipeline"
version = "0.1.0"
description = "Sanitized Oracle-to-Microsoft-Fabric reference pipeline"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
oracle = ["oracledb>=2,<4"]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
